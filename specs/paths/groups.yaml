/groups:
  get:
    operationId: getGroups
    tags:
      - Groups
    summary: Get a list of groups
    security:
      - OAuth2:
          - public
    parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of groups
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Group"
      default:
        $ref: "#/components/responses/ErrorResponse"

/users/{user_id}/groups:
  get:
    operationId: getGroupsByUserId
    tags:
      - Groups
    summary: Get all groups of a user
    security:
      - OAuth2:
          - public
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of groups
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Group"
      default:
        $ref: "#/components/responses/ErrorResponse"

/groups/{id}:
  get:
    operationId: getGroupById
    tags:
      - Groups
    summary: Get a group by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the group
        schema:
          type: string
    responses:
      "200":
        description: A group object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      default:
        $ref: "#/components/responses/ErrorResponse"

/groups/{group_id}/users:
  get:
    operationId: getUsersByGroupId
    tags:
      - Groups
      - Users
    summary: Get all users of a group
    security:
      - OAuth2:
          - public
    parameters:
      - name: group_id
        in: path
        required: true
        description: The ID of the group
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of users
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightUser"
      default:
        $ref: "#/components/responses/ErrorResponse"
