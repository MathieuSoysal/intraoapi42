/skills:
  get:
    operationId: getSkills
    tags:
      - Skills
    summary: Get a list of skills
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, created_at, updated_at, slug.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, created_at, updated_at, slug.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, created_at, updated_at, slug.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of skills
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Skill"
      default:
        $ref: "#/components/responses/ErrorResponse"

/cursus/{cursus_id}/skills:
  get:
    operationId: getSkillsByCursusId
    tags:
      - Skills
    summary: Get all skills of a cursus
    security:
      - OAuth2:
          - public
    parameters:
      - name: cursus_id
        in: path
        required: true
        description: The ID or slug of the cursus
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of skills
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Skill"
      default:
        $ref: "#/components/responses/ErrorResponse"

/skills/{id}:
  get:
    operationId: getSkillById
    tags:
      - Skills
    summary: Get a skill by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID or slug of the skill
        schema:
          type: string
    responses:
      "200":
        description: A skill object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Skill"
      default:
        $ref: "#/components/responses/ErrorResponse"
