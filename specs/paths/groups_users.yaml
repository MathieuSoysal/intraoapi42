/groups_users/{id}:
  get:
    operationId: getGroupsUserById
    tags:
      - Groups users
    summary: Get a group user association by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the group user association
        schema:
          type: string
