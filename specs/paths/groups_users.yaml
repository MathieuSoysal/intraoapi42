/groups_users:
  get:
    operationId: getGroupsUsers
    tags:
      - Groups users
    summary: Get a list of group user associations
    security:
      - OAuth2:
          - public
    parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of group user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GroupsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

/groups/{group_id}/groups_users:
  get:
    operationId: getGroupsUsersByGroupId
    tags:
      - Groups users
    summary: Get all group user associations for a group
    security:
      - OAuth2:
          - public
    parameters:
      - name: group_id
        in: path
        required: true
        description: The ID of the group
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of group user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GroupsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

