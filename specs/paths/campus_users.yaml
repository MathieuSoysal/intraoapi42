/campus_users:
  get:
    operationId: getCampusUsers
    tags:
      - Campus users
    summary: Get a list of campus user associations
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, user_id, campus_id, is_primary, created_at, updated_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, user_id, campus_id, is_primary, created_at, updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, user_id, campus_id, is_primary, created_at, updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of campus user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CampusUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

/users/{user_id}/campus_users:
  get:
    operationId: getCampusUsersByUserId
    tags:
      - Campus users
    summary: Get all campus user associations for a user
    security:
      - OAuth2:
          - public
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field.
          Must be one of: id, user_id, campus_id, is_primary, created_at, updated_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, user_id, campus_id, is_primary, created_at, updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of campus user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CampusUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

/campus_users/{id}:
  get:
    operationId: getCampusUserById
    tags:
      - Campus users
    summary: Get a campus user association by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the campus user association
        schema:
          type: string
    responses:
      "200":
        description: A campus user association
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusUser"
      default:
        $ref: "#/components/responses/ErrorResponse"
