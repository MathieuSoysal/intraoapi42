/events_users:
  get:
    operationId: getEventsUsers
    tags:
      - Events users
    summary: Get a list of event user registrations
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, event_id, user_id, created_at, updated_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, event_id, user_id, created_at, updated_at, campus_id.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, event_id, user_id, created_at, updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of event user registrations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EventsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

  post:
    operationId: createEventsUser
    tags:
      - Events users
    summary: Register a user to an event
    security:
      - OAuth2:
          - public
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - events_user
            properties:
              events_user:
                type: object
                required:
                  - event_id
                  - user_id
                properties:
                  event_id:
                    type: integer
                  user_id:
                    type: integer
    responses:
      "201":
        description: Event user registration created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

/events_users/{id}:
  get:
    operationId: getEventsUserById
    tags:
      - Events users
    summary: Get an event user registration by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the event user registration
        schema:
          type: string
    responses:
      "200":
        description: An event user registration
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

  patch:
    operationId: updateEventsUser
    tags:
      - Events users
    summary: Update an event user registration
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the event user registration
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              events_user:
                type: object
                properties:
                  event_id:
                    type: integer
                  user_id:
                    type: integer
    responses:
      "200":
        description: Event user registration updated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

  delete:
    operationId: deleteEventsUser
    tags:
      - Events users
    summary: Unregister a user from an event
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the event user registration
        schema:
          type: string
    responses:
      "204":
        description: Event user registration deleted
      default:
        $ref: "#/components/responses/ErrorResponse"
