/expertises/{expertise_id}/expertises_users:
  get:
    operationId: getExpertisesUsersByExpertiseId
    tags:
      - Expertises users
    summary: Get all users with an expertise
    security:
      - OAuth2:
          - public
    parameters:
      - name: expertise_id
        in: path
        required: true
        description: The ID or slug of the expertise
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, expertise_id, user_id, interested, value, created_at, updated_at, contact_me.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, expertise_id, user_id, interested, value, created_at, updated_at, contact_me.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of expertise user records
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ExpertisesUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

