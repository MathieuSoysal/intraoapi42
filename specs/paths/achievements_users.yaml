/achievements/{achievement_id}/achievements_users:
  get:
    operationId: getAchievementsUsersByAchievementId
    tags:
      - Achievements users
    summary: Get all users who earned an achievement
    security:
      - OAuth2:
          - public
    parameters:
      - name: achievement_id
        in: path
        required: true
        description: The ID of the achievement
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, user_id, achievement_id, nbr_of_success, created_at, updated_at, rewarded.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, user_id, achievement_id, nbr_of_success, created_at, updated_at, rewarded.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, user_id, achievement_id, nbr_of_success, created_at, updated_at, rewarded.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of achievement user records
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AchievementsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

