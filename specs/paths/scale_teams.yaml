/scale_teams/{id}:
  get:
    operationId: getScaleTeamById
    tags:
      - Scale teams
    summary: Get a scale team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the scale team
        schema:
          type: string
    responses:
      "200":
        description: A scale team object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleTeam"
      default:
        $ref: "#/components/responses/ErrorResponse"

  patch:
    operationId: updateScaleTeam
    tags:
      - Scale teams
    summary: Update a scale team (submit an evaluation)
    security:
      - OAuth2:
          - projects
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the scale team
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              scale_team:
                type: object
                properties:
                  comment:
                    type: string
                    maxLength: 2048
                  flag_id:
                    type: [integer, "null"]
                  final_mark:
                    type: [integer, "null"]
                  truant_id:
                    type: [integer, "null"]
                  answers_attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:
                          type: integer
                        value:
                          type: [integer, "null"]
                        id:
                          type: [integer, "null"]
    responses:
      "200":
        description: Scale team updated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleTeam"
      default:
        $ref: "#/components/responses/ErrorResponse"

  delete:
    operationId: deleteScaleTeam
    tags:
      - Scale teams
    summary: Delete a scale team
    security:
      - OAuth2:
          - projects
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the scale team
        schema:
          type: string
    responses:
      "204":
        description: Scale team deleted
      default:
        $ref: "#/components/responses/ErrorResponse"

