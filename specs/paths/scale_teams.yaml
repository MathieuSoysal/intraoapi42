/scale_teams:
  get:
    operationId: getScaleTeams
    tags:
      - Scale teams
    summary: Get a list of scale teams (evaluations)
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, user_id, begin_at, created_at, updated_at, scale_id, team_id, comment, old_feedback, feedback_rating, final_mark, truant_id, flag_id, token, ip, internship_id, filled_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, user_id, begin_at, created_at, updated_at, scale_id, team_id, comment, old_feedback, feedback_rating, final_mark, truant_id, flag_id, token, ip, internship_id, filled_at, campus_id, cursus_id, future, filled.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, user_id, begin_at, created_at, updated_at, scale_id, team_id, final_mark, filled_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of scale teams
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ScaleTeam"
      default:
        $ref: "#/components/responses/ErrorResponse"

  post:
    operationId: createScaleTeam
    tags:
      - Scale teams
    summary: Create a scale team (schedule an evaluation)
    security:
      - OAuth2:
          - projects
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - scale_team
            properties:
              scale_team:
                type: object
                required:
                  - team_id
                  - scale_id
                  - comment
                properties:
                  team_id:
                    type: integer
                  scale_id:
                    type: integer
                  comment:
                    type: string
                    maxLength: 2048
                  user_id:
                    type: [integer, "null"]
                  flag_id:
                    type: [integer, "null"]
                  final_mark:
                    type: [integer, "null"]
                  truant_id:
                    type: [integer, "null"]
                  answers_attributes:
                    type: array
                    items:
                      type: object
                      required:
                        - question_id
                      properties:
                        question_id:
                          type: integer
                        value:
                          type: [integer, "null"]
                        id:
                          type: [integer, "null"]
    responses:
      "201":
        description: Scale team created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleTeam"
      default:
        $ref: "#/components/responses/ErrorResponse"

