/events:
  get:
    operationId: getEvents
    tags:
      - Events
    summary: Get a list of events
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, begin_at, end_at, name, description, location, kind, max_people, created_at, updated_at, prohibition_of_cancellation, difficulty, remote.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, begin_at, end_at, name, description, location, kind, max_people, created_at, updated_at, prohibition_of_cancellation, difficulty, remote, future, end.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, begin_at, end_at, name, description, location, kind, max_people, created_at, updated_at, prohibition_of_cancellation, difficulty, remote.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of events
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Event"
      default:
        $ref: "#/components/responses/ErrorResponse"

