/campus:
  get:
    operationId: getCampus
    tags:
      - Campus
    summary: Get a list of campus
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, created_at, updated_at, time_zone, language_id, slug, main_email, endpoint_id, vogsphere_id, content_email, time_of_community_service_started, companies_mail, address, zip, city, country, pro_needs_validation, logo, website, facebook, twitter, display_name, email_extension, help_url, active, open_to_job_offers, default_hidden_phone, tig_email, minimum_slot_duration, alumni_system, manual_alumnization_before_first_internship, public.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, created_at, updated_at, time_zone, language_id, slug, main_email, endpoint_id, vogsphere_id, content_email, time_of_community_service_started, companies_mail, address, zip, city, country, pro_needs_validation, logo, website, facebook, twitter, display_name, email_extension, help_url, active, open_to_job_offers, default_hidden_phone, tig_email, minimum_slot_duration, alumni_system, manual_alumnization_before_first_internship, public.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, created_at, updated_at, time_zone, language_id, slug, active, public.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of campus
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightCampus"
      default:
        $ref: "#/components/responses/ErrorResponse"

/campus/{id}:
  get:
    operationId: getCampusById
    tags:
      - Campus
    summary: Get a campus by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID or slug of the campus
        schema:
          type: string
    responses:
      "200":
        description: A campus object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Campus"
      default:
        $ref: "#/components/responses/ErrorResponse"

/campus/{campus_id}/users:
  get:
    operationId: getUsersByCampusId
    tags:
      - Campus
      - Users
    summary: Get all users of a campus
    security:
      - OAuth2:
          - public
    parameters:
      - name: campus_id
        in: path
        required: true
        description: The ID or slug of the campus
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of users
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightUser"
      default:
        $ref: "#/components/responses/ErrorResponse"
