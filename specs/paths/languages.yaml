/languages/{id}:
  get:
    operationId: getLanguageById
    tags:
        - Languages
    summary: Get a language by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the language
        schema:
          type: integer
    responses:
      "200":
        description: A language object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Language"
      default:
        $ref: "#/components/responses/ErrorResponse"
