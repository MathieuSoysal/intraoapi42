/cursus:
  get:
    operationId: getCursus
    tags:
      - Cursus
    summary: Get a list of cursus
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, created_at, updated_at, slug, kind, restricted, is_subscriptable.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, created_at, updated_at, slug, kind, restricted, is_subscriptable.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, created_at, updated_at, slug, kind, restricted, is_subscriptable.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of cursus
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Cursus"
      default:
        $ref: "#/components/responses/ErrorResponse"

/cursus/{id}:
  get:
    operationId: getCursusById
    tags:
      - Cursus
    summary: Get a cursus by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID or slug of the cursus
        schema:
          type: string
    responses:
      "200":
        description: A cursus object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cursus"
      default:
        $ref: "#/components/responses/ErrorResponse"

/cursus/{cursus_id}/users:
  get:
    operationId: getUsersByCursusId
    tags:
      - Cursus
      - Users
    summary: Get all users of a cursus
    security:
      - OAuth2:
          - public
    parameters:
      - name: cursus_id
        in: path
        required: true
        description: The ID or slug of the cursus
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of users
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightUser"
      default:
        $ref: "#/components/responses/ErrorResponse"
