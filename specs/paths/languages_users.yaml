/users/{user_id}/languages_users:
  get:
    operationId: getLanguagesUsersByUserId
    tags:
      - Languages users
    summary: Get all language user associations for a user
    security:
      - OAuth2:
          - public
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, language_id, user_id, position, created_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, language_id, user_id, position, created_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of language user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LanguageUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

