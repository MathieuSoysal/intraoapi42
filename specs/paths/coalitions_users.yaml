/coalitions/{coalition_id}/coalitions_users:
  get:
    operationId: getCoalitionsUsersByCoalitionId
    tags:
      - Coalitions users
    summary: Get all users of a coalition
    security:
      - OAuth2:
          - public
    parameters:
      - name: coalition_id
        in: path
        required: true
        description: The ID or slug of the coalition
        schema:
          type: string
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, coalition_id, user_id, created_at, updated_at, this_year_score, this_year_score_updated_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, coalition_id, user_id, created_at, updated_at, this_year_score, this_year_score_updated_at, this_year_score_updated.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, coalition_id, user_id, created_at, updated_at, this_year_score, this_year_score_updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of coalition user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CoalitionsUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

