/slots/{id}:
  get:
    operationId: getSlotById
    tags:
      - Slots
    summary: Get a slot by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the slot
        schema:
          type: string
    responses:
      "200":
        description: A slot object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Slot"
      default:
        $ref: "#/components/responses/ErrorResponse"

  patch:
    operationId: updateSlot
    tags:
      - Slots
    summary: Update a slot
    security:
      - OAuth2:
          - projects
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the slot
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              slot:
                type: object
                properties:
                  begin_at:
                    type: string
                    format: date-time
                  end_at:
                    type: string
                    format: date-time
                  scale_team_id:
                    type: [integer, "null"]
    responses:
      "200":
        description: Slot updated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Slot"
      default:
        $ref: "#/components/responses/ErrorResponse"

  delete:
    operationId: deleteSlot
    tags:
      - Slots
    summary: Delete a slot
    security:
      - OAuth2:
          - projects
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the slot
        schema:
          type: string
    responses:
      "204":
        description: Slot deleted
      default:
        $ref: "#/components/responses/ErrorResponse"
