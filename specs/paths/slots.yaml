/slots:
  get:
    operationId: getSlots
    tags:
      - Slots
    summary: Get a list of slots available for evaluations
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, begin_at, end_at, user_id, created_at, scale_team_id.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, begin_at, end_at, created_at, campus_id, future, end.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, begin_at, end_at, created_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of slots
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Slot"
      default:
        $ref: "#/components/responses/ErrorResponse"

  post:
    operationId: createSlot
    tags:
      - Slots
    summary: Create a new evaluation slot
    description: |
      Creates slots for a user. Intervals are scaled to 15-minute granularity;
      durations over 15 minutes create multiple slots. Slots must be between
      30 minutes and 2 weeks in advance.
    security:
      - OAuth2:
          - projects
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - slot
            properties:
              slot:
                type: object
                required:
                  - user_id
                  - begin_at
                  - end_at
                properties:
                  user_id:
                    type: integer
                    description: Must match the token owner unless Advanced tutor
                  begin_at:
                    type: string
                    format: date-time
                  end_at:
                    type: string
                    format: date-time
                  scale_team_id:
                    type: [integer, "null"]
                    description: Optional defense to link to this slot
    responses:
      "201":
        description: Slot created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Slot"
      default:
        $ref: "#/components/responses/ErrorResponse"

