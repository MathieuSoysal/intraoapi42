/teams/{id}:
  get:
    operationId: getTeamById
    tags:
      - Teams
    summary: Get a team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    responses:
      "200":
        description: A team object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Team"
      default:
        $ref: "#/components/responses/ErrorResponse"
  patch:
    operationId: PatchTeamById
    tags:
      - Teams
    summary: Patch a team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - team
            properties:
              team:
                $ref: "#/components/schemas/TeamUpdate"
          example:
            team:
              project_id: 5
    responses:
      "204":
        description: Team has been patched
      default:
        $ref: '#/components/responses/ErrorResponse'
  put:
    operationId: PutTeamById
    tags:
      - Teams
    summary: Update a team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - team
            properties:
              team:
                $ref: "#/components/schemas/TeamUpdate"
          example:
            team:
              project_id: 5
    responses:
      "204":
        description: Team has been updated
      default:
        $ref: '#/components/responses/ErrorResponse'
/teams/{id}/reset_team_uploads:
  post:
    operationId: PostResetTeamUploadsById
    tags:
      - Teams
    summary: Reset team uploads by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    responses:
      "201":
        description: Team Uploads as been reset
      default:
        $ref: '#/components/responses/ErrorResponse'

/teams:
  get:
    operationId: getTeams
    tags:
      - Teams
    summary: Get a list of teams
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, project_id, name, created_at, updated_at, locked_at, closed_at, final_mark, repo_url, repo_uuid, deadline_at, terminating_at, project_session_id, status.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, project_id, name, created_at, updated_at, locked_at, closed_at, final_mark, repo_url, repo_uuid, deadline_at, terminating_at, project_session_id, status, cursus, active_cursus, campus, primary_campus, locked, closed, deadline, terminating, with_mark.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, project_id, name, created_at, updated_at, locked_at, closed_at, final_mark, repo_url, repo_uuid, deadline_at, terminating_at, project_session_id, status.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of teams
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightTeam"
      default:
        $ref: "#/components/responses/ErrorResponse"

  post:
    operationId: createTeam
    tags:
      - Teams
    summary: Create a team
    security:
      - OAuth2:
          - projects
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - team
            properties:
              team:
                $ref: "#/components/schemas/TeamUpdate"
    responses:
      "201":
        description: Team created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Team"
      default:
        $ref: "#/components/responses/ErrorResponse"

