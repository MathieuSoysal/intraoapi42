/teams/{id}:
  get:
    operationId: getTeamById
    tags:
      - Teams
    summary: Get a team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: integer
    responses:
      "200":
        description: A team object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamResponse"
      default:
        $ref: "#/components/responses/ErrorResponse"
  patch:
    operationId: PatchTeamById
    tags:
      - Teams
    summary: Patch a team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - team
            properties:
              team:
                $ref: "#/components/schemas/TeamUpdate"
          example:
            team:
              project_id: 5
    responses:
      "204":
        description: Team has been patched
      default:
        $ref: '#/components/responses/ErrorResponse'
  put:
    operationId: PutTeamById
    tags:
      - Teams
    summary: Update a team by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - team
            properties:
              team:
                $ref: "#/components/schemas/TeamUpdate"
          example:
            team:
              project_id: 5
    responses:
      "204":
        description: Team has been updated
      default:
        $ref: '#/components/responses/ErrorResponse'
/teams/{id}/reset_team_uploads:
  post:
    operationId: PostResetTeamUploadsById
    tags:
      - Teams
    summary: Reset team uploads by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the team
        schema:
          type: string
    responses:
      "201":
        description: Team Uploads as been reset
      default:
        $ref: '#/components/responses/ErrorResponse'
