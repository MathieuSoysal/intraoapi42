/projects/{id}:
  get:
    operationId: getProjectById
    tags:
      - Projects
    summary: Get a project by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID or slug of the project
        schema:
          type: string
    responses:
      "200":
        description: A project object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
      default:
        $ref: "#/components/responses/ErrorResponse"
