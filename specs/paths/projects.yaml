/projects:
  get:
    operationId: getProjects
    tags:
      - Projects
    summary: Get a list of projects
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, created_at, updated_at, visible, exam, parent_id, slug, inherited_team, position, has_git, has_mark, repository, git_id, cached_repository_path.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, created_at, updated_at, visible, exam, parent_id, slug, inherited_team, position, has_git, has_mark, description, repository, git_id, difficulty.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, created_at, updated_at, parent_id, slug, position, description, difficulty.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of projects
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightProject"
      default:
        $ref: "#/components/responses/ErrorResponse"

/cursus/{cursus_id}/projects:
  get:
    operationId: getProjectsByCursusId
    tags:
      - Projects
    summary: Get all projects of a cursus
    security:
      - OAuth2:
          - public
    parameters:
      - name: cursus_id
        in: path
        required: true
        description: The ID or slug of the cursus
        schema:
          type: string
      - name: sort
        in: query
        description: The sort field.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: Filtering on one or more fields.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of projects
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
