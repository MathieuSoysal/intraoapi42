/translations:
  get:
    operationId: getTranslations
    tags:
      - Translations
    summary: Get a list of translations
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, translatable_id, translatable_type, language_id, fields, created_at, updated_at, user_id, default, up_to_date, translations_structure_id.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, translatable_id, translatable_type, language_id, fields, created_at, updated_at, user_id, default, up_to_date, translations_structure_id.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of translations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Translation"
      default:
        $ref: "#/components/responses/ErrorResponse"

/translations/{id}:
  get:
    operationId: getTranslationById
    tags:
      - Translations
    summary: Get a translation by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the translation
        schema:
          type: string
    responses:
      "200":
        description: A translation object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Translation"
      default:
        $ref: "#/components/responses/ErrorResponse"
