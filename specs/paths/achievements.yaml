/achievements:
  get:
    operationId: getAchievements
    tags:
      - Achievements
    summary: Get a list of achievements
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, internal_name, kind, tier, description, pedago, visible, nbr_of_success, parent_id, image, created_at, updated_at, slug, position, reward, title_id.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, internal_name, kind, tier, description, pedago, visible, nbr_of_success, parent_id, image, created_at, updated_at, slug, position, reward, title_id.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, internal_name, kind, tier, description, pedago, visible, nbr_of_success, parent_id, image, created_at, updated_at, slug, position, reward, title_id.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of achievements
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Achievement"
      default:
        $ref: "#/components/responses/ErrorResponse"

