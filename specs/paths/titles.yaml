/titles:
  get:
    operationId: getTitles
    tags:
      - Titles
    summary: Get a list of titles
    security:
      - OAuth2:
          - public
    parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of titles
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Title"
      default:
        $ref: "#/components/responses/ErrorResponse"

/users/{user_id}/titles:
  get:
    operationId: getTitlesByUserId
    tags:
      - Titles
    summary: Get all titles of a user
    security:
      - OAuth2:
          - public
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of titles
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Title"
      default:
        $ref: "#/components/responses/ErrorResponse"

/titles/{id}:
  get:
    operationId: getTitleById
    tags:
      - Titles
    summary: Get a title by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the title
        schema:
          type: string
    responses:
      "200":
        description: A title object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Title"
      default:
        $ref: "#/components/responses/ErrorResponse"

/achievements/{achievement_id}/titles:
  get:
    operationId: getTitlesByAchievementId
    tags:
      - Titles
    summary: Get all titles linked to an achievement
    security:
