/titles/{title_id}/titles_users:
  get:
    operationId: getTitlesUsersByTitleId
    tags:
      - Titles users
    summary: Get all users who have a title
    security:
      - OAuth2:
          - public
    parameters:
      - name: title_id
        in: path
        required: true
        description: The ID of the title
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of title user associations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TitleUser"
      default:
        $ref: "#/components/responses/ErrorResponse"

