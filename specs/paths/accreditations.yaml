/accreditations:
  get:
    operationId: getAccreditations
    tags:
      - Accreditations
    summary: Get a list of accreditations
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, user_id, cursus_id, difficulty, validated, created_at, updated_at.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, user_id, cursus_id, difficulty, validated, created_at, updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, user_id, cursus_id, difficulty, validated, created_at, updated_at.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of accreditations
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightAccreditation"
      default:
        $ref: "#/components/responses/ErrorResponse"

/accreditations/{id}:
  get:
    operationId: getAccreditationById
    tags:
      - Accreditations
    summary: Get an accreditation by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the accreditation
        schema:
          type: string
    responses:
      "200":
        description: An accreditation object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Accreditation"
      default:
        $ref: "#/components/responses/ErrorResponse"

/accreditations/{accreditation_id}/users:
  get:
    operationId: getUsersByAccreditationId
    tags:
      - Accreditations
      - Users
    summary: Get all users of an accreditation
    security:
      - OAuth2:
          - public
    parameters:
      - name: accreditation_id
        in: path
        required: true
        description: The ID of the accreditation
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of users
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightUser"
      default:
        $ref: "#/components/responses/ErrorResponse"
