/users/{user_id}/projects_users:
  get:
    operationId: GetProjectsUsersByUserId
    summary: Get a list of projects users by a user Id
    security:
      - OAuth2:
        - public
    parameters:
      - name: user_id
        in: path
        required: true
        description: The ID of the user
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, login, email, created_at, updated_at, pool_year, pool_month, kind, status, primary_campus_id, first_name, last_name, alumni?, staff?.
          Example: filter[id]=a_value,another_value (to filter on users with id matching a_value or another_value)
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, login, email, created_at, updated_at, pool_year, pool_month, kind, status.
          Example: range[status]=min_value,max_value (to range on users with status field between min_value and max_value)
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/page_number'
      - $ref: '#/components/parameters/page_size'
    responses:
      '200':
        description: A list of projects users
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Page:
            $ref: '#/components/headers/X-Page'
          X-Per-Page:
            $ref: '#/components/headers/X-Per-Page'
          X-Total:
            $ref: '#/components/headers/X-Total'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProjectUserResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
/projects_users:
  post:
    operationId: PostProjectsUsers
    summary: Create a project user
    security:
      - OAuth2:
          - public
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - projects_user
            properties:
              projects_user:
                $ref: "#/components/schemas/PostProjectUserBody"
          example:
            projects_user:
              project_id: 1
              user_id: 1
    responses:
      "201":
        description: Project user created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUserResponse"
      "400":
        $ref: '#/components/responses/ErrorResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
/projects_users/{id}:
  patch:
    operationId: PatchProjectUserById
    summary: Update a project user
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the project user
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - projects_user
            properties:
              projects_user:
                $ref: "#/components/schemas/ProjectUserUpdate"
          example:
            projects_user:
              project_id: 1
              user_id: 1
    responses:
      "204":
        description: Project user updated successfully
      "400":
        $ref: '#/components/responses/ErrorResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  put:
    operationId: PutProjectUserById
    summary: Update a project user
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the project user
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - projects_user
            properties:
              projects_user:
                $ref: "#/components/schemas/ProjectUserUpdate"
          example:
            projects_user:
              project_id: 1
              user_id: 1
    responses:
      "204":
        description: Project user updated successfully
      default:
        $ref: '#/components/responses/ErrorResponse'