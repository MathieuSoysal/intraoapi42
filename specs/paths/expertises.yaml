/expertises:
  get:
    operationId: getExpertises
    tags:
      - Expertises
    summary: Get a list of expertises
    security:
      - OAuth2:
          - public
    parameters:
      - name: sort
        in: query
        description: |
          The sort field. Sorted by id desc by default.
          Must be one of: id, name, slug, created_at, updated_at, kind.
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filtering on one or more fields.
          Must be one of: id, name, slug, created_at, updated_at, kind.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - name: range
        in: query
        description: |
          Select on a particular range.
          Must be one of: id, name, slug, created_at, updated_at, kind.
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
        style: deepObject
        explode: true
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of expertises
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Expertise"
      default:
        $ref: "#/components/responses/ErrorResponse"

/expertises/{id}:
  get:
    operationId: getExpertiseById
    tags:
      - Expertises
    summary: Get an expertise by ID
    security:
      - OAuth2:
          - public
    parameters:
      - name: id
        in: path
        required: true
        description: The ID or slug of the expertise
        schema:
          type: string
    responses:
      "200":
        description: An expertise object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Expertise"
      default:
        $ref: "#/components/responses/ErrorResponse"

/expertises/{expertise_id}/users:
  get:
    operationId: getUsersByExpertiseId
    tags:
      - Expertises
      - Users
    summary: Get all users with an expertise
    security:
      - OAuth2:
          - public
    parameters:
      - name: expertise_id
        in: path
        required: true
        description: The ID or slug of the expertise
        schema:
          type: string
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/per_page"
      - $ref: "#/components/parameters/page_number"
      - $ref: "#/components/parameters/page_size"
    responses:
      "200":
        description: A list of users
        headers:
          Link:
            $ref: "#/components/headers/Link"
          X-Page:
            $ref: "#/components/headers/X-Page"
          X-Per-Page:
            $ref: "#/components/headers/X-Per-Page"
          X-Total:
            $ref: "#/components/headers/X-Total"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LightUser"
      default:
        $ref: "#/components/responses/ErrorResponse"
