TeamUpdate:
  type: object
  properties:
    project_id:
      type: integer
      format: int64
      nullable: true
      description: The project id.
    name:
      type: string
      maxLength: 255
      nullable: true
      description: The name.
    created_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    updated_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    locked_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    closed_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    final_mark:
      type: integer
      format: int64
      nullable: true
      description: The final mark.
    repo_url:
      type: string
      nullable: true
      description: The repo url.
    repo_uuid:
      type: string
      nullable: true
      description: The repo uuid.
    deadline_at:
      type: integer
      format: int64
      nullable: true
      description: The deadline at. Must be after today.
    terminating_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    project_session_id:
      type: integer
      format: int64
      nullable: true
      description: The project session id.
    teams_users_attributes:
      type: array
      nullable: true
      description: The teams users attributes.
      items:
        type: object
        required:
          - user_id
        properties:
          user_id:
            type: integer
            format: int64
            description: The user id. Must be unique in the scope of a given team.
          leader:
            type: boolean
            nullable: true
            default: false
            description: Is it leader?
          validated:
            type: boolean
            nullable: true
            default: false
            description: Is it validated?
          occurrence:
            type: integer
            format: int64
            nullable: true
            default: 0
            description: The occurrence.