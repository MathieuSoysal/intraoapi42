UserResponse:
  allOf:
    - $ref: "#/components/schemas/LightUserResponse"
    - type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupResponse"
        cursus_users:
          type: array
          items:
            $ref: "#/components/schemas/CursusUserResponse"
        projects_users:
          type: array
          items:
            $ref: "#/components/schemas/ProjectUserResponse"
        languages_users:
          type: array
          items:
            $ref: "#/components/schemas/LanguageUserResponse"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/AchievementResponse"
        titles:
          type: array
          items:
            $ref: "#/components/schemas/TitleResponse"
        titles_users:
          type: array
          items:
            $ref: "#/components/schemas/TitleUserResponse"
        patroned:
          type: array
          items:
            $ref: "#/components/schemas/PatronageResponse"
        patroning:
          type: array
          items:
            $ref: "#/components/schemas/PatronageResponse"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleResponse"
        campus:
          type: array
          items:
            $ref: "#/components/schemas/CampusResponse"
        campus_users:
          type: array
          items:
            $ref: "#/components/schemas/CampusUserResponse"
      required:
        - groups
        - cursus_users
        - projects_users
        - languages_users
        - achievements
        - titles
        - titles_users
        - patroned
        - patroning
        - roles
        - campus
        - campus_users

LightUserResponse:
  type: object
  properties:
    id:
      type: integer
      description: The unique identifier of the user.
    login:
      type: string
      description: The login name of the user.
    first_name:
      type: string
      description: The first name of the user.
    usual_first_name:
      type: string
      description: The usual first name of the user, first_name if none.
      nullable: true
    usual_full_name:
      type: string
      description: The usual full name of the user, usually usual_first_name or first_name + last_name.
    last_name:
      type: string
      description: The last name of the user.
    email:
      type: string
      description: The email address of the user.
      format: email
    url:
      type: string
      format: uri
      description: The URL to the user's resource.
    phone:
      type: string
      description: The phone number of the user (always hidden).
    displayname:
      type: string
      description: The display name of the user.
    kind:
      type: string
      description: The kind of user (e.g., student, admin, external).
      enum:
        - student
        - admin
        - external
    image:
      $ref: "#/components/schemas/UserImageResponse"
    staff?:
      type: boolean
      description: Indicates if the user is staff.
    correction_point:
      type: integer
      description: The user's correction points.
    pool_month:
      type: string
      description: The month of the user's pool.
    pool_year:
      type: string
      description: The year of the user's pool.
    location:
      type: string
      description: The location of the user.
      nullable: true
    wallet:
      type: integer
      description: The user's wallet balance.
    anonymize_date:
      type: string
      format: date-time
      x-go-type: IntraTime
      description: The date when user data will be anonymized.
    data_erasure_date:
      type: string
      format: date-time
      x-go-type: IntraTime
      description: The date when user data will be erased.
    created_at:
      type: string
      format: date-time
      x-go-type: IntraTime
      description: The user creation timestamp.
    updated_at:
      type: string
      format: date-time
      x-go-type: IntraTime
      description: The last user update timestamp.
    alumnized_at:
      description: The date when the user became an alumnus.
      type: string
      format: date-time
      x-go-type: IntraTime
    alumni?:
      type: boolean
      description: Indicates if the user is an alumnus.
    active?:
      type: boolean
      description: Indicates if the user is active.

  required:
    - id
    - login
    - first_name
    - last_name
    - usual_full_name
    - email
    - url
    - displayname
    - kind
    - image
    - staff?
    - correction_point
    - pool_month
    - pool_year
    - wallet
    - anonymize_date
    - data_erasure_date
    - created_at
    - updated_at
    - alumnized_at
    - alumni?
    - active?

UserImageResponse:
  type: object
  properties:
    link:
      type: string
      format: uri
      description: The URL to the user's image.
    versions:
      type: object
      properties:
        large:
          type: string
          format: uri
          description: URL to the large version of the user's image.
        medium:
          type: string
          format: uri
          description: URL to the medium version of the user's image.
        small:
          type: string
          format: uri
          description: URL to the small version of the user's image.
        micro:
          type: string
          format: uri
          description: URL to the micro version of the user's image.
      required:
        - large
        - medium
        - small
        - micro
  required:
    - link
    - versions
