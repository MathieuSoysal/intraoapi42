Slot:
  type: object
  properties:
    id:
      type: integer
    begin_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    end_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    scale_team_id:
      type: [integer, "null"]
    user:
      $ref: "#/components/schemas/LightUser"
    created_at:
      type: string
      format: date-time
      x-go-type: IntraTime
  required:
    - id
    - begin_at
    - end_at

SlotCreate:
  type: object
  required:
    - slot
  properties:
    slot:
      type: object
      required:
        - user_id
        - begin_at
        - end_at
      properties:
        user_id:
          type: integer
          description: Must match the token owner unless Advanced tutor
        begin_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        end_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        scale_team_id:
          type: [integer, "null"]
          description: Optional defense to link to this slot
