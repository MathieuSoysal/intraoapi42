ProjectUserResponse:
  type: object
  properties:
    id:
      type: integer
    occurrence:
      type: integer
    final_mark:
      type: integer
      nullable: true
    status:
      type: string
    validated:
      type: boolean
      nullable: true
    current_team_id:
      type: integer
    project:
      $ref: "#/components/schemas/ProjectLightResponse"
    cursus_ids:
      type: array
      items:
        type: integer
    marked_at:
      type: string
      format: date-time
      nullable: true
    marked:
      type: boolean
    retriable_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - occurrence
    - status
    - marked
    - cursus_ids
    - created_at
    - updated_at
