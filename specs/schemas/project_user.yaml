ProjectUserResponse:
  type: object
  properties:
    id:
      type: integer
    occurrence:
      type: integer
    final_mark:
      type: integer
      nullable: true
    status:
      type: string
    validated?:
      type: boolean
      nullable: true
    current_team_id:
      type: integer
    project:
      $ref: "#/components/schemas/LightProjectResponse"
    cursus_ids:
      type: array
      items:
        type: integer
    user:
      $ref: "#/components/schemas/LightUserResponse"
    teams:
      type: array
      items:
        $ref: "#/components/schemas/LightTeamResponse"
    marked_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    marked:
      type: boolean
      nullable: true
    retriable_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    created_at:
      type: string
      format: date-time
      x-go-type: IntraTime
    updated_at:
      type: string
      format: date-time
      x-go-type: IntraTime
  required:
    - id
    - occurrence
    - status
    - validated?
    - current_team_id
    - project
    - cursus_ids
    - user
    - teams

PostProjectUserBody:
  type: object
  required:
    - project_id
    - user_id
  properties:
    id:
      type: integer
      format: int64
      nullable: true
      description: The id.
    project_id:
      type: integer
      format: int64
      description: The project id.
    user_id:
      type: integer
      format: int64
      description: The user id. Must be unique in the scope of a given project.
    created_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    updated_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    occurrence:
      type: integer
      format: int64
      nullable: true
      default: 0
      description: The occurrence.
    final_mark:
      type: integer
      format: int64
      nullable: true
      description: The final mark.
    retriable_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    marked_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
    status:
      type: string
      nullable: true
      default: unknown
      description: The status.
    skip_check_permission:
      type: string
      nullable: true
      description: The skip check permission.

ProjectUserUpdate:
  type: object
  properties:
    id:
      type: integer
      format: int64
      nullable: true
      description: The id.
    project_id:
      type: integer
      format: int64
      nullable: true
      description: The project id.
    user_id:
      type: integer
      format: int64
      nullable: true
      description: The user id. Must be unique in the scope of a given project.
    created_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
      description: The created at.
    updated_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
      description: The updated at.
    occurrence:
      type: integer
      format: int64
      nullable: true
      default: 0
      description: The occurrence. Default to 0.
    final_mark:
      type: integer
      format: int64
      nullable: true
      description: The final mark.
    retriable_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
      description: The retriable at.
    marked_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: IntraTime
      description: The marked at.
    status:
      type: string
      nullable: true
      default: unknown
      description: The status. Default to unknown.
    skip_check_permission:
      type: string
      nullable: true
      description: The skip check permission.