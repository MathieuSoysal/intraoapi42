CampusUserResponse:
  type: object
  properties:
    id:
      type: integer
    user_id:
      type: integer
    campus_id:
      type: integer
    is_primary:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - user_id
    - campus_id
    - is_primary
    - created_at
    - updated_at
