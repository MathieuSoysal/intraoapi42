Location:
  type: object
  properties:
    id:
      type: integer
    begin_at:
      type: string
      format: date-time
    end_at:
      type: [string, "null"]
      format: date-time
    primary:
      type: boolean
    host:
      type: string
    campus_id:
      type: integer
    user:
      $ref: "#/components/schemas/LightUser"
  required:
    - id
    - begin_at
    - primary
    - host
    - campus_id
