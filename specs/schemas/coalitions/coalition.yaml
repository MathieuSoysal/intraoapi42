Coalition:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    slug:
      type: string
    image_url:
      type: [string, "null"]
      format: uri
    cover_url:
      type: [string, "null"]
      format: uri
    color:
      type: string
    score:
      type: integer
    user_id:
      type: integer
    bloc_id:
      type: integer
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - name
    - slug
    - color
    - score
    - user_id
    - bloc_id
