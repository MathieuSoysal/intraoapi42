openapi: 3.1.2
info:
  title: Intra 42 API
  description: |
    This is the OpenAPI specification for the Intra 42 API v2.
  version: v1.1.0
servers:
  - url: https://api.intra.42.fr/v2
    description: Production
  - url: https://api.intra-staging.42.fr/v2
    description: Staging
paths:
  /closes:
    get:
      operationId: getCloses
      tags:
        - Closes
      summary: Get a list of closes
      security:
        - OAuth2:
            - public
      parameters:
        - name: sort
          in: query
          description: |
            The sort field. Sorted by created_at desc, id desc by default.
            Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid.
          required: false
          schema:
            type: string
            enum:
              - id
              - user_id
              - closer_id
              - reason
              - state
              - created_at
              - updated_at
              - kind
              - end_at
              - jid
        - name: filter
          in: query
          description: |
            Filtering on one or more fields. Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid, campus_id, end.
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: range
          in: query
          description: |
            Select on a particular range. Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid.
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: A list of closes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloseResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /users/{user_id}/closes:
    get:
      operationId: getClosesByUserId
      tags:
        - Closes
      summary: Get a list of closes by user id
      security:
        - OAuth2:
            - public
      parameters:
        - name: user_id
          in: path
          required: true
          description: The user id
          schema:
            type: integer
        - name: sort
          in: query
          description: |
            The sort field. Sorted by created_at desc, id desc by default.
            Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid.
          required: false
          schema:
            type: string
            enum:
              - id
              - user_id
              - closer_id
              - reason
              - state
              - created_at
              - updated_at
              - kind
              - end_at
              - jid
        - name: filter
          in: query
          description: |
            Filtering on one or more fields. Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid, campus_id, end.
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: range
          in: query
          description: |
            Select on a particular range. Must be one of: id, user_id, closer_id, reason, state, created_at, updated_at, kind, end_at, jid.
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: A list of closes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloseResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /closes/{id}:
    get:
      operationId: getCloseById
      tags:
        - Closes
      summary: Get a close by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the close
          schema:
            type: integer
      responses:
        '200':
          description: A close object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /internships:
    get:
      operationId: getInternships
      tags:
        - Internships
      summary: Get a list of internships
      security:
        - OAuth2:
            - public
      parameters:
        - name: sort
          in: query
          description: |
            The sort field. Sorted by id desc by default.
            Must be one of: id, user_id, administration_id, offer_id, language_id, state, days, user_address, user_postal, user_city, user_country, company_name, company_boss_user_first_name, company_boss_user_last_name, company_boss_user_email, company_boss_user_phone, company_user_first_name, company_user_last_name, company_user_post, company_user_email, company_user_phone, company_address, company_postal, company_city, company_country, company_siret, internship_address, internship_postal, internship_city, internship_country, contract_type, subject, start_at, end_at, duration, nb_days, nb_hours, movement, salary, currency, breach_at, convention, created_at, updated_at, anti_grav_units_user_id.
            Example: -updated_at,anti_grav_units_user_id (to sort by updated_at descending and anti_grav_units_user_id ascending)
          required: false
          schema:
            type: string
        - name: filter
          in: query
          description: |
            Filtering on one or more fields.
            Must be one of: id, user_id, administration_id, offer_id, language_id, state, days, user_address, user_postal, user_city, user_country, company_name, company_boss_user_first_name, company_boss_user_last_name, company_boss_user_email, company_boss_user_phone, company_user_first_name, company_user_last_name, company_user_post, company_user_email, company_user_phone, company_address, company_postal, company_city, company_country, company_siret, internship_address, internship_postal, internship_city, internship_country, contract_type, subject, start_at, end_at, duration, nb_days, nb_hours, movement, salary, currency, breach_at, convention, created_at, updated_at, anti_grav_units_user_id.
            Example: filter[id]=a_value,another_value (to filter on internships with id matching a_value or another_value)
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: range
          in: query
          description: |
            Select on a particular range.
            Must be one of: id, user_id, administration_id, offer_id, language_id, state, days, user_address, user_postal, user_city, user_country, company_name, company_boss_user_first_name, company_boss_user_last_name, company_boss_user_email, company_boss_user_phone, company_user_first_name, company_user_last_name, company_user_post, company_user_email, company_user_phone, company_address, company_postal, company_city, company_country, company_siret, internship_address, internship_postal, internship_city, internship_country, contract_type, subject, start_at, end_at, duration, nb_days, nb_hours, movement, salary, currency, breach_at, convention, created_at, updated_at.
            Example: range[status]=min_value,max_value (to range on internships with status field between min_value and max_value)
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: A list of internships
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Total:
              $ref: '#/components/headers/X-Total'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternshipResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /languages/{id}:
    get:
      operationId: getLanguageById
      tags:
        - Languages
      summary: Get a language by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the language
          schema:
            type: integer
      responses:
        '200':
          description: A language object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /users/{user_id}/projects_users:
    get:
      operationId: GetProjectsUsersByUserId
      tags:
        - Projects Users
      summary: Get a list of projects users by a user Id
      security:
        - OAuth2:
            - public
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the user
          schema:
            type: string
        - name: filter
          in: query
          description: |
            Filtering on one or more fields.
            Must be one of: id, login, email, created_at, updated_at, pool_year, pool_month, kind, status, primary_campus_id, first_name, last_name, alumni?, staff?.
            Example: filter[id]=a_value,another_value (to filter on users with id matching a_value or another_value)
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: range
          in: query
          description: |
            Select on a particular range.
            Must be one of: id, login, email, created_at, updated_at, pool_year, pool_month, kind, status.
            Example: range[status]=min_value,max_value (to range on users with status field between min_value and max_value)
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: A list of projects users
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Total:
              $ref: '#/components/headers/X-Total'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUserResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /projects_users:
    post:
      operationId: PostProjectsUsers
      tags:
        - Projects Users
      summary: Create a project user
      security:
        - OAuth2:
            - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projects_user
              properties:
                projects_user:
                  $ref: '#/components/schemas/ProjectUserCreate'
            example:
              projects_user:
                project_id: 1
                user_id: 1
      responses:
        '201':
          description: Project user created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUserResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /projects_users/{id}:
    patch:
      operationId: PatchProjectUserById
      tags:
        - Projects Users
      summary: Update a project user
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the project user
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projects_user
              properties:
                projects_user:
                  $ref: '#/components/schemas/ProjectUserUpdate'
            example:
              projects_user:
                project_id: 1
                user_id: 1
      responses:
        '204':
          description: Project user updated successfully
        '400':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: PutProjectUserById
      tags:
        - Projects Users
      summary: Update a project user
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the project user
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projects_user
              properties:
                projects_user:
                  $ref: '#/components/schemas/ProjectUserUpdate'
            example:
              projects_user:
                project_id: 1
                user_id: 1
      responses:
        '204':
          description: Project user updated successfully
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{id}:
    get:
      operationId: getTeamById
      tags:
        - Teams
      summary: Get a team by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team
          schema:
            type: integer
      responses:
        '200':
          description: A team object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: PatchTeamById
      tags:
        - Teams
      summary: Patch a team by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - team
              properties:
                team:
                  $ref: '#/components/schemas/TeamUpdate'
            example:
              team:
                project_id: 5
      responses:
        '204':
          description: Team has been patched
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: PutTeamById
      tags:
        - Teams
      summary: Update a team by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - team
              properties:
                team:
                  $ref: '#/components/schemas/TeamUpdate'
            example:
              team:
                project_id: 5
      responses:
        '204':
          description: Team has been updated
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{id}/reset_team_uploads:
    post:
      operationId: PostResetTeamUploadsById
      tags:
        - Teams
      summary: Reset team uploads by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team
          schema:
            type: string
      responses:
        '201':
          description: Team Uploads as been reset
        default:
          $ref: '#/components/responses/ErrorResponse'
  /users/{id}/user_candidature:
    get:
      operationId: getUserCandidatureById
      tags:
        - User Candidatures
      summary: Get user candidature information
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user
          schema:
            type: string
      responses:
        '200':
          description: User candidature information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCandidatureResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /users:
    get:
      operationId: getUsers
      tags:
        - Users
      summary: Get a list of users
      security:
        - OAuth2:
            - public
      parameters:
        - name: sort
          in: query
          description: |
            The sort field. Sorted by id desc by default.
            Must be one of: id, login, email, encrypted_password, reset_password_token, reset_password_sent_at, created_at, updated_at, image, first_name, last_name, pool_year, pool_month, kind, status, otp_secret_key, otp_tmp, otp_activated, otp_backup_passwords, slack_team, slack_login, slack_mail, slack_code_validation, slack_validated_at, token_id, email_stop, linked_user_id, usual_first_name, last_seen_at, password_changed_at, encrypted_single_usage_password, first_warn_anon_sent_at, second_warn_anon_sent_at, alumnized_at, anonymized_at.
            Example: -alumnized_at,anonymized_at (to sort on alumnized_at descending and anonymized_at ascending)
          required: false
          schema:
            type: string
        - name: filter
          in: query
          description: |
            Filtering on one or more fields.
            Must be one of: id, login, email, created_at, updated_at, pool_year, pool_month, kind, status, primary_campus_id, first_name, last_name, alumni?, staff?.
            Example: filter[id]=a_value,another_value (to filter on users with id matching a_value or another_value)
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: range
          in: query
          description: |
            Select on a particular range.
            Must be one of: id, login, email, created_at, updated_at, pool_year, pool_month, kind, status.
            Example: range[status]=min_value,max_value (to range on users with status field between min_value and max_value)
          required: false
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page_number'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: A list of users
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Total:
              $ref: '#/components/headers/X-Total'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LightUserResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /users/{id}:
    get:
      operationId: getUserById
      tags:
        - Users
      summary: Get a user by ID
      security:
        - OAuth2:
            - public
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user
          schema:
            type: string
      responses:
        '200':
          description: A user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    AchievementResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        tier:
          type: string
        kind:
          type: string
        visible:
          type: boolean
        image:
          type: string
        nbr_of_success:
          type:
            - integer
            - 'null'
        users_url:
          type: string
          format: uri
      required:
        - id
        - name
        - description
        - tier
        - kind
        - visible
        - image
        - users_url
    CampusResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        time_zone:
          type: string
        language:
          $ref: '#/components/schemas/LanguageResponse'
        users_count:
          type: integer
        vogsphere_id:
          type: integer
        country:
          type: string
        address:
          type: string
        zip:
          type: string
        city:
          type: string
        website:
          type: string
          format: uri
        facebook:
          type: string
          format: uri
        twitter:
          type: string
          format: uri
        active:
          type: boolean
        public:
          type: boolean
        email_extension:
          type: string
        default_hidden_phone:
          type: boolean
      required:
        - id
        - name
        - time_zone
        - users_count
        - vogsphere_id
        - country
        - city
        - active
        - public
        - email_extension
    CampusUserResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        campus_id:
          type: integer
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        updated_at:
          type: string
          format: date-time
          x-go-type: IntraTime
      required:
        - id
        - user_id
        - campus_id
        - is_primary
        - created_at
        - updated_at
    CloseResponse:
      type: object
      properties:
        id:
          type: integer
        reason:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        updated_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        end_at:
          type:
            - string
            - 'null'
          format: date-time
          x-go-type: IntraTime
        community_services:
          type: array
          items:
            $ref: '#/components/schemas/CommunityServiceResponse'
        kind:
          type: string
          enum:
            - agu
            - other
            - deserter
            - pace_unknown
            - black_hole
            - serious_misconduct
            - social_security
            - non_admitted
        user:
          $ref: '#/components/schemas/LightUserResponse'
        closer:
          $ref: '#/components/schemas/LightUserResponse'
      required:
        - id
        - reason
        - state
        - created_at
        - updated_at
        - community_services
        - user
        - closer
        - kind
    CommunityServiceResponse:
      type: object
      properties:
        id:
          type: integer
        duration:
          type: integer
        schedule_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        occupation:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        updated_at:
          type: string
      required:
        - id
        - duration
        - schedule_at
        - occupation
        - state
        - created_at
        - updated_at
    CursusResponse:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
      required:
        - id
        - created_at
        - name
        - slug
        - kind
    CursusUserResponse:
      type: object
      properties:
        id:
          type: integer
        begin_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        end_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        grade:
          type: string
        level:
          type: number
          format: double
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillResponse'
        cursus_id:
          type: integer
        cursus:
          $ref: '#/components/schemas/CursusResponse'
        has_coalition:
          type: boolean
        blackholed_at:
          type:
            - string
            - 'null'
          format: date-time
          x-go-type: IntraTime
        created_at:
          type: string
          format: date-time
          x-go-type: IntraTime
        updated_at:
