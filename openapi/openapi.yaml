  parameters:
    page:
      name: page
      in: query
      description: |
        Page number (1-based). The 42 API paginates index endpoints and defaults to 30 items per page.
        You can also use the `per_page` parameter to set the page size (up to 100 for many endpoints).
      required: false
      schema:
        type: integer
        minimum: 1
    per_page:
      name: per_page
      in: query
      description: |
        Number of items per page. Maximum is generally 100 but some endpoints limit this for technical reasons.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    page_number:
      name: page[number]
      in: query
      description: |
        Alternate pagination style using `page[number]` (1-based page index). Can be used together with `page[size]`.
      required: false
      schema:
        type: integer
        minimum: 1
    page_size:
      name: page[size]
      in: query
      description: |
        Alternate pagination style to set the page size (maximum depends on endpoint, commonly up to 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  headers:
    Link:
      description: |
        RFC5988 Web Linking header containing `first`, `prev`, `next` and `last` links when available.
        Example: <https://api.intra.42.fr/v2/Users?page=2>; rel="next", <https://api.intra.42.fr/v2/Users?page=1>; rel="prev"
      schema:
        type: string
    X-Page:
      description: The current page number.
      schema:
        type: integer
    X-Per-Page:
      description: The current pagination length (items per page).
      schema:
        type: integer
    X-Total:
      description: The total number of pages available for the resource.
      schema:
        type: integer
